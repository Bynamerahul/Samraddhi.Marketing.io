<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 280" width="240" height="280">
  <defs>
    <!-- 3D Clay Body Gradient -->
    <radialGradient id="bodyClay" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#2a2d3d"/>
      <stop offset="50%" stop-color="#12141d"/>
      <stop offset="100%" stop-color="#07080c"/>
    </radialGradient>

    <!-- 3D Belly Clay Gradient -->
    <radialGradient id="bellyClay" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#f0f4f8"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </radialGradient>

    <!-- Yellow Rim Accent -->
    <linearGradient id="yellowRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe600"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>

    <!-- Red 3D Beak Gradient -->
    <radialGradient id="beakRed" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ff70a6"/>
      <stop offset="40%" stop-color="#ff4d8d"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </radialGradient>

    <!-- Orange Feet Gradient -->
    <linearGradient id="orangeFeet" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff9f1c"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <style type="text/css">
      <![CDATA[
      /* Pingu Smooth Keyframe Animations */
      .pingu-whole-body {
        transform-origin: 115px 230px;
        animation: pinguIdleWaddle 3.2s ease-in-out infinite;
      }

      @keyframes pinguIdleWaddle {
        0%, 100% { transform: rotate(0deg) translateY(0); }
        25% { transform: rotate(-2.5deg) translateY(-2px); }
        75% { transform: rotate(2.5deg) translateY(-1px); }
      }

      /* Enthusiastic Hand Wave */
      .pingu-waving-flipper {
        transform-origin: 165px 115px;
        animation: pinguWaveFlipper 1.8s ease-in-out infinite;
      }

      @keyframes pinguWaveFlipper {
        0%, 100% { transform: rotate(0deg); }
        15% { transform: rotate(-24deg); }
        30% { transform: rotate(16deg); }
        45% { transform: rotate(-20deg); }
        60% { transform: rotate(12deg); }
        75% { transform: rotate(-8deg); }
      }

      /* Natural Eyelid Blinking */
      .pingu-eyes-group {
        transform-origin: 115px 62px;
        animation: pinguBlink 4s infinite;
      }

      @keyframes pinguBlink {
        0%, 94%, 100% { transform: scaleY(1); }
        97% { transform: scaleY(0.08); }
      }

      /* Beak Smile & Noot Noot Pulse */
      .pingu-beak-group {
        transform-origin: 115px 78px;
        animation: pinguBeakNoot 2.4s ease-in-out infinite;
      }

      @keyframes pinguBeakNoot {
        0%, 100% { transform: scale(1) translateY(0); }
        35% { transform: scale(1.08, 0.94) translateY(1px); }
        50% { transform: scale(0.96, 1.08) translateY(-2px); }
        70% { transform: scale(1.04, 1.02) translateY(0); }
      }

      /* Cute Rosy Glowing Cheeks */
      .pingu-blush-cheeks {
        animation: pinguBlushPulse 2.5s ease-in-out infinite alternate;
      }

      @keyframes pinguBlushPulse {
        0% { opacity: 0.25; }
        100% { opacity: 0.7; }
      }
      ]]>
    </style>
  </defs>

  <!-- Vector Ground Shadow -->
  <ellipse cx="115" cy="262" rx="72" ry="12" fill="#000000" opacity="0.3"/>

  <g class="pingu-whole-body">
    
    <!-- Feet Left & Right -->
    <!-- Left Foot -->
    <path d="M 65 235 C 40 235, 30 255, 60 265 C 115 270, 130 250, 105 240 Z" fill="url(#orangeFeet)" stroke="#b45309" stroke-width="2"/>
    <!-- Right Foot -->
    <path d="M 135 240 C 145 240, 215 230, 220 255 C 215 270, 155 270, 130 250 Z" fill="url(#orangeFeet)" stroke="#b45309" stroke-width="2"/>
    
    <!-- Legs -->
    <rect x="78" y="215" width="16" height="30" rx="8" fill="url(#orangeFeet)"/>
    <rect x="142" y="215" width="16" height="30" rx="8" fill="url(#orangeFeet)"/>

    <!-- Right Static Flipper (Behind) -->
    <path d="M 60 110 C 25 150, 20 200, 55 220 C 75 225, 80 180, 82 140 Z" fill="url(#bodyClay)" stroke="#2a2d3d" stroke-width="2"/>

    <!-- Torso Body -->
    <ellipse cx="115" cy="160" rx="58" ry="75" fill="url(#bodyClay)"/>

    <!-- Yellow Rim around Belly -->
    <ellipse cx="116" cy="165" rx="42" ry="58" fill="url(#yellowRim)"/>

    <!-- White Clay Belly -->
    <ellipse cx="115" cy="165" rx="38" ry="54" fill="url(#bellyClay)"/>
    <ellipse cx="102" cy="140" rx="16" ry="28" fill="#ffffff" opacity="0.4"/>

    <!-- Head -->
    <circle cx="115" cy="70" r="50" fill="url(#bodyClay)"/>

    <!-- Cute Specular Highlights on Head -->
    <ellipse cx="90" cy="38" rx="14" ry="7" fill="#ffffff" opacity="0.25" transform="rotate(-20 90 38)"/>

    <!-- Rosy Blush Cheeks for Cute Smile -->
    <g class="pingu-blush-cheeks">
      <ellipse cx="78" cy="78" rx="10" ry="6" fill="#ff4d8d" opacity="0.5"/>
      <ellipse cx="152" cy="78" rx="10" ry="6" fill="#ff4d8d" opacity="0.5"/>
    </g>

    <!-- Eyes (Animated Blinking) -->
    <g class="pingu-eyes-group">
      <!-- Left Eye -->
      <ellipse cx="96" cy="62" rx="11" ry="13" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
      <circle cx="96" cy="62" r="5" fill="#0f172a"/>
      <circle cx="94" cy="59" r="2.5" fill="#ffffff"/>

      <!-- Right Eye -->
      <ellipse cx="134" cy="62" rx="11" ry="13" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
      <circle cx="134" cy="62" r="5" fill="#0f172a"/>
      <circle cx="132" cy="59" r="2.5" fill="#ffffff"/>
    </g>

    <!-- Red 3D Beak (Animated Smile & Noot Noot Mouth) -->
    <g class="pingu-beak-group">
      <ellipse cx="115" cy="78" rx="20" ry="14" fill="url(#beakRed)" stroke="#991b1b" stroke-width="1.5"/>
      <ellipse cx="111" cy="73" rx="8" ry="4" fill="#ffffff" opacity="0.65"/>
      <!-- Cute Beak Smile Dimple Line -->
      <path d="M 103 82 Q 115 89 127 82" stroke="#7f1d1d" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    </g>

    <!-- Left Animated Waving Flipper (Front) -->
    <g class="pingu-waving-flipper">
      <path d="M 175 90 C 215 50, 235 70, 205 115 C 190 135, 168 130, 160 110 Z" fill="url(#bodyClay)" stroke="#2a2d3d" stroke-width="2"/>
      <ellipse cx="205" cy="72" r="5" fill="#ffffff" opacity="0.6"/>
    </g>

  </g>
</svg>
