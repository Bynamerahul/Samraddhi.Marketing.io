<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="pinkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff4d8d"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background Squircle -->
  <rect width="512" height="512" rx="128" fill="#0e0f12"/>
  <rect width="496" height="496" x="8" y="8" rx="120" fill="none" stroke="url(#pinkGrad)" stroke-width="12" opacity="0.5"/>
  
  <!-- Stylized Samraddhi 'S' Icon -->
  <path d="M 330 175 C 330 135 295 120 256 120 C 200 120 160 155 160 200 C 160 275 330 255 330 320 C 330 370 280 392 240 392 C 180 392 145 350 145 300" 
        fill="none" stroke="url(#pinkGrad)" stroke-width="48" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  
  <!-- Glowing Pink Dot Accent -->
  <circle cx="365" cy="365" r="28" fill="#ff4d8d" filter="url(#glow)"/>
</svg>
